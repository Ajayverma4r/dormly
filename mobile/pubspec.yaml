name: dormly
description: One Platform. Every Property.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  file_picker: ^8.3.0
  url_launcher: ^6.2.5
  razorpay_flutter: ^1.3.8
  google_mobile_ads: ^9.1.0
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# Generate app icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logoApk.png
  adaptive_icon_background: "#5218D1"
  adaptive_icon_foreground: assets/images/logoApk.png
  remove_alpha_ios: true

# Generate native splash: dart run flutter_native_splash:create
# Color-only native splash (no centered logo) so cold-boot matches Flutter
# SplashScreen purple immediately — Picture 2 is drawn by Flutter.
flutter_native_splash:
  color: "#5218D1"
  fullscreen: true
  android: true
  ios: true
  android_12:
    color: "#5218D1"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
